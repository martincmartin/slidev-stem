# Publish one talk to GitHub Pages, at /<repo>/<talk>/. Each talk has its own
# directory on the gh-pages branch, and a run replaces only that directory, so
# a retired talk keeps the build that it was last published with. The build
# uses the files of the tag or ref, not of main. See docs/talks.md, "Publish a
# talk".
name: Publish a talk

on:
  push:
    tags: ["given/*/*"]
  workflow_dispatch:
    inputs:
      talk:
        description: "The talk's directory, for example watches"
        required: true
      ref:
        description: "The tag, branch or commit to build"
        required: true
        default: main

permissions:
  contents: write

# Two runs at once would each push a gh-pages without the other's talk.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: src
          fetch-depth: 0

      - name: Find the talk
        working-directory: src
        env:
          INPUT_TALK: ${{ inputs.talk }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TALK" ]; then
            talk="$INPUT_TALK" ref="$INPUT_REF"
          else
            talk="$(echo "$GITHUB_REF_NAME" | cut -d/ -f2)" ref="$GITHUB_REF_NAME"
          fi
          case "$talk" in
            "" | *[!a-z0-9-]*) echo "not a talk name: '$talk'" >&2; exit 1 ;;
          esac
          if [ ! -f "$talk/package.json" ]; then
            echo "no talk '$talk' at $ref" >&2; exit 1
          fi
          # A retired talk is built only from its retired tag: main may no
          # longer build it (AGENTS.md, "Given talks, retired talks and
          # versions").
          retired="$(git tag -l "retired/$talk/*")"
          if [ -n "$retired" ] && ! echo "$retired" | grep -qxF "$ref"; then
            echo "$talk is retired: publish it from its tag ($retired)" >&2
            exit 1
          fi
          {
            echo "TALK=$talk"
            echo "REF=$ref"
            echo "PNPM_VERSION=$(jq -r .devEngines.packageManager.version "$talk/package.json")"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      # pnpm then downloads the Node version that the talk pins (devEngines).
      - name: Install pnpm
        run: npm install --global "pnpm@$PNPM_VERSION"

      - name: Install the talk
        working-directory: src
        run: |
          set -euo pipefail
          cd "$TALK"
          pnpm install --frozen-lockfile
          # The system libraries that the prerender's Chromium needs.
          pnpm exec playwright install-deps chromium

      # `build` and an optional `prerender` write the site to the talk's
      # dist/ (docs/talks.md, "Publish a talk").
      - name: Build the talk
        working-directory: src
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          cd "$TALK"
          pnpm build --base "/$REPO/$TALK/"
          pnpm run --if-present prerender

      - name: Push the site to gh-pages
        working-directory: src
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          built="$(git rev-parse HEAD)"
          if git fetch origin gh-pages:gh-pages; then
            git worktree add "$site" gh-pages
          else
            git worktree add --orphan -b gh-pages "$site"
          fi
          rm -rf "${site:?}/$TALK"
          cp -R "$TALK/dist" "$site/$TALK"
          # The root page comes from the default branch, so that publishing
          # an old tag does not bring back an old list of talks.
          git show "origin/$DEFAULT_BRANCH:site/index.html" > "$site/index.html"
          touch "$site/.nojekyll"
          cd "$site"
          git add -A
          # One commit with the whole site: the branch does not grow with
          # each publish. Every published version can be rebuilt from its tag.
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit="$(git commit-tree "$(git write-tree)" -m "Publish $TALK from $REF ($built)")"
          git push --force origin "$commit:refs/heads/gh-pages"
