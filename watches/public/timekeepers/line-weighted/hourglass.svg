<svg width="122" height="97" viewBox="0 0 240 190" xmlns="http://www.w3.org/2000/svg">
<!-- Line's bulbs sit at x=88/152 rather than the 86/154 the other sets use, so
     the clips are drawn one unit tighter to stay inside the 3-wide outline. The
     clips reach the bulb's own ends, y=18 and y=172, so the sand meets the rails
     with no gap. They used to stop at 20 and 170 and left a pale strip at each end.

     THE FALLING STREAM ENDS AT THE PILE'S CREST, and its y2 tracks the crest
     (168 -> 146 -> 130) on the same 9 s clock as the pile. Painting it to the floor
     does not work here: the sand is fill-opacity 0.85, not solid, so a stream drawn
     underneath SHOWS THROUGH the sand it has already landed in. Depth ordering is
     not enough when the thing on top is translucent. -->
<defs>
  <clipPath id="t13-h-up"><path d="M90 18 L150 18 C150 62 124 80 121 94 L119 94 C116 80 90 62 90 18 Z"/></clipPath>
  <clipPath id="t13-h-lo"><path d="M119 96 C116 110 90 128 90 172 L150 172 C150 128 124 110 121 96 Z"/></clipPath>
</defs>
<line x1="70" y1="18" x2="70" y2="172" stroke="#736A60" stroke-width="8"/>
<line x1="170" y1="18" x2="170" y2="172" stroke="#736A60" stroke-width="8"/>
<rect x="62" y="8" width="116" height="10" rx="3" fill="#736A60"/>
<rect x="62" y="172" width="116" height="10" rx="3" fill="#736A60"/>
<g clip-path="url(#t13-h-up)">
  <rect x="88" y="18" width="64" height="78" fill="#143C6B" fill-opacity="0.85">
    <animate attributeName="y" values="18;94" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="height" values="78;0" dur="9s" repeatCount="indefinite"/>
  </rect>
</g>
<line x1="120" y1="96" x2="120" y2="168" stroke="#143C6B" stroke-width="5" stroke-dasharray="6 6">
  <animate attributeName="stroke-dashoffset" values="24;0" dur="0.6s" repeatCount="indefinite"/>
  <animate attributeName="y2" values="168;146;130" dur="9s" repeatCount="indefinite"/>
</line>
<g clip-path="url(#t13-h-lo)">
  <path d="M90 172 L150 172 L150 170 C139 169 130 168 120 168 C110 168 101 169 90 170 Z" fill="#143C6B" fill-opacity="0.85">
    <animate attributeName="d" values="M90 172 L150 172 L150 170 C139 169 130 168 120 168 C110 168 101 169 90 170 Z;M90 172 L150 172 L150 158 C139 156 130 146 120 146 C110 146 101 156 90 158 Z;M90 172 L150 172 L150 148 C139 145 130 130 120 130 C110 130 101 145 90 148 Z" dur="9s" repeatCount="indefinite"/>
  </path>
</g>
<path d="M88 18 C88 62 114 80 116 95 C114 110 88 128 88 172" stroke="#143C6B" stroke-width="6" fill="none"/>
<path d="M152 18 C152 62 126 80 124 95 C126 110 152 128 152 172" stroke="#143C6B" stroke-width="6" fill="none"/>
</svg>
