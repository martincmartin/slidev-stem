<svg width="122" height="97" viewBox="0 0 240 190" xmlns="http://www.w3.org/2000/svg">
<style>
.tk-hourglass-fill-muted { fill: var(--palette-muted, #736A60); }
.tk-hourglass-fill-subject { fill: var(--palette-subject, #143C6B); }
.tk-hourglass-stroke-muted { stroke: var(--palette-muted, #736A60); }
.tk-hourglass-stroke-subject { stroke: var(--palette-subject, #143C6B); }
</style>
<!-- The clips reach the bulb's ends, y=18 and y=172, so the sand meets the rails
     with no gap. Their sides (x=90/150) are under the outline's stroke
     (x=88/152, width 6), so the sand meets the glass with no gap either.

     The falling stream ends at the pile's crest, and its y2 tracks the crest
     (168 -> 146 -> 130) on the pile's 9 s clock. Do not draw it to the floor
     under the pile: the sand is translucent (fill-opacity 0.85), so the stream
     would show through it. -->
<defs>
  <clipPath id="hourglass-upper-clip"><path d="M90 18 L150 18 C150 62 124 80 121 94 L119 94 C116 80 90 62 90 18 Z"/></clipPath>
  <clipPath id="hourglass-lower-clip"><path d="M119 96 C116 110 90 128 90 172 L150 172 C150 128 124 110 121 96 Z"/></clipPath>
</defs>
<line x1="70" y1="18" x2="70" y2="172" stroke="#736A60" stroke-width="8" class="tk-hourglass-stroke-muted"/>
<line x1="170" y1="18" x2="170" y2="172" stroke="#736A60" stroke-width="8" class="tk-hourglass-stroke-muted"/>
<rect x="62" y="8" width="116" height="10" rx="3" fill="#736A60" class="tk-hourglass-fill-muted"/>
<rect x="62" y="172" width="116" height="10" rx="3" fill="#736A60" class="tk-hourglass-fill-muted"/>
<g clip-path="url(#hourglass-upper-clip)">
  <rect x="88" y="18" width="64" height="78" fill="#143C6B" fill-opacity="0.85" class="tk-hourglass-fill-subject">
    <animate attributeName="y" values="18;94" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="height" values="78;0" dur="9s" repeatCount="indefinite"/>
  </rect>
</g>
<line x1="120" y1="96" x2="120" y2="168" stroke="#143C6B" stroke-width="5" stroke-dasharray="6 6" class="tk-hourglass-stroke-subject">
  <animate attributeName="stroke-dashoffset" values="24;0" dur="0.6s" repeatCount="indefinite"/>
  <animate attributeName="y2" values="168;146;130" dur="9s" repeatCount="indefinite"/>
</line>
<g clip-path="url(#hourglass-lower-clip)">
  <path d="M90 172 L150 172 L150 170 C139 169 130 168 120 168 C110 168 101 169 90 170 Z" fill="#143C6B" fill-opacity="0.85" class="tk-hourglass-fill-subject">
    <animate attributeName="d" values="M90 172 L150 172 L150 170 C139 169 130 168 120 168 C110 168 101 169 90 170 Z;M90 172 L150 172 L150 158 C139 156 130 146 120 146 C110 146 101 156 90 158 Z;M90 172 L150 172 L150 148 C139 145 130 130 120 130 C110 130 101 145 90 148 Z" dur="9s" repeatCount="indefinite"/>
  </path>
</g>
<path d="M88 18 C88 62 114 80 116 95 C114 110 88 128 88 172" stroke="#143C6B" stroke-width="6" fill="none" class="tk-hourglass-stroke-subject"/>
<path d="M152 18 C152 62 126 80 124 95 C126 110 152 128 152 172" stroke="#143C6B" stroke-width="6" fill="none" class="tk-hourglass-stroke-subject"/>
</svg>
