<!-- The favicon (art/favicon.py writes public/favicon.ico). Here, not in the
     headmatter's `favicon`: Slidev writes that path as it is, so under a
     build's --base (GitHub Pages) the browser asks the host's root for it.
     Vite puts the base in place of %BASE_URL%. -->
<head>
  <link rel="icon" href="%BASE_URL%favicon.ico" />
</head>
