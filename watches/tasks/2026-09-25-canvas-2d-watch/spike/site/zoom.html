<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zoom spike</title>
<!--
A copy of the zoom task's spike page (../../../2026-09-25-zoom-to-hairspring/
spike/site/zoom.html) with one new option, renderer=canvas. The SVG renderer
is unchanged. Serve this directory and open zoom.html; the query string picks
the variant:

  renderer=svg | canvas               draw the SVG inline, or read it with
                                      watch_player.js and draw it with Canvas
                                      2D. The canvas always uses the JS camera
                                      and starts the fade when the camera
                                      stops (as fadelater=1); stroke=scaled
                                      turns its line compensation off

  svg=watch-1dp.svg | watch-2dp.svg   which drawing (make_svgs.py writes them)
  mode=svg | html | js | js-css       the camera: a CSS transition on the
                                      SVG's <g class="camera">, or on an HTML
                                      <div> around the <svg>; or a JS loop that
                                      writes the camera's transform attribute
                                      at each frame; or a JS loop that writes
                                      the CSS transform of the <svg> element
                                      itself, which has will-change: transform
                                      (Martin's suggestion, C22)
  willchange=0                        (mode=js-css) no will-change
  ease=linear | exp                   the scale moves linearly, or its log does
                                      (both eased in and out)
  stroke=fixed | scaled | compensated vector-effect: non-scaling-stroke; or
                                      nothing (lines grow with the zoom); or
                                      (mode=js only) each stroke-width divided
                                      by the scale, which the JS camera sets as
                                      --s at each frame
  host=1.5                            scale the whole stage, as Slidev scales a
                                      slide to fit the window
  dur=1.8  fade=0.8                   seconds
  smil=paused&t=0.5                   stop the mechanism at t seconds
  only=hairspring                     hide the rest from the start (to measure
                                      the hairspring's width during the zoom)
  fadelater=1                         on zoom in, start the fade only when the
                                      camera stops, instead of a CSS
                                      transition-delay pending during the move
  clips=off                           remove every clip-path (to measure their
                                      cost); clips=erase (canvas only): draw
                                      each clipped group, then erase its hole
  drop=spring,balance,fork,train,seconds
                                      remove those SMIL animations (to find
                                      which moving part makes Firefox stall)
  auto=3&label=firefox-canvas         zoom in and out 3 times by itself,
                                      record every frame, and POST the result
                                      to ./report (real_browsers.py serves it)
-->
<style>
@property --z {
  syntax: "<number>";
  inherits: true;
  initial-value: 0;
}
body { margin: 16px; background: #555; font: 14px sans-serif; color: #eee; }
#host { width: 980px; height: 552px; transform-origin: 0 0; }
#stage {
  width: 980px; height: 552px; overflow: hidden; position: relative;
  background: #faf7f0; /* --palette-background in ledger.css */
  --move-delay: var(--fade);
}
#stage.zoomed { --move-delay: 0s; }
#lens, #lens > svg, #lens > canvas { position: absolute; inset: 0; transform-origin: 0 0; }
#lens > canvas { width: 980px; height: 552px; }

/* the camera: linear in scale */
.cam { transition: transform var(--dur) ease-in-out var(--move-delay); }
.zoomed .cam {
  transform: translate(calc(var(--X) * 1px), calc(var(--Y) * 1px)) scale(var(--S));
}
/* the camera: linear in log scale. The translation follows the scale, so one
   point of the canvas stays still: a dolly, not a pan plus a zoom. */
.exp .cam {
  --z: 0;
  transition: --z var(--dur) ease-in-out var(--move-delay);
  transform:
    translate(calc(var(--X) / (var(--S) - 1) * (exp(var(--z)) - 1) * 1px),
              calc(var(--Y) / (var(--S) - 1) * (exp(var(--z)) - 1) * 1px))
    scale(exp(var(--z)));
}
.exp.zoomed .cam { --z: var(--Z); }

/* the fade: parts that appear fade in at once; parts that go fade out after
   the camera has moved. The opacity itself comes from the SVG's own <style>. */
#stage svg [data-part] { transition: opacity var(--fade) ease 0s; }
#stage.zoomed svg [data-part] { transition-delay: var(--dur); }
#stage.fade-later.zoomed svg [data-part] { transition-delay: 0s; }

.fixed-stroke svg * { vector-effect: non-scaling-stroke; }
/* the drawing's four stroke widths, the house ladder */
.compensated svg [stroke-width="2"] { stroke-width: calc(2px / var(--s, 1)); }
.compensated svg [stroke-width="2.5"] { stroke-width: calc(2.5px / var(--s, 1)); }
.compensated svg [stroke-width="3"] { stroke-width: calc(3px / var(--s, 1)); }
.compensated svg [stroke-width="4"] { stroke-width: calc(4px / var(--s, 1)); }
.only-spring svg [data-part="rest"] { opacity: 0 !important; transition: none !important; }
#controls { margin-top: 12px; }
button { font-size: 16px; padding: 6px 14px; }
</style>
</head>
<body>
<div id="host"><div id="stage"><div id="lens"></div></div></div>
<div id="controls">
  <button id="toggle">Zoom in</button>
  <span id="status"></span>
</div>
<script type="module">
import { DRAW_OPTIONS, camera as cameraAt, draw, readDrawing } from "./watch_player.js";

const params = new URLSearchParams(location.search);
const option = (name, fallback) => params.get(name) ?? fallback;
const stage = document.getElementById("stage");
const lens = document.getElementById("lens");

async function setup() {
  const source = await (await fetch(option("svg", "watch-1dp.svg"))).text();
  const onCanvas = option("renderer", "svg") === "canvas";
  let svg = null, canvas = null;
  if (onCanvas) {
    // Only the SVG's view CSS goes into the page, for the probe below.
    const style = document.createElement("style");
    style.textContent = new DOMParser().parseFromString(source, "image/svg+xml")
      .querySelector("style").textContent;
    document.head.append(style);
    canvas = document.createElement("canvas");
    lens.append(canvas);
  } else {
    lens.innerHTML = source;
    svg = lens.querySelector("svg");
  }
  const host = Number(option("host", "1"));
  const hostBox = document.getElementById("host");
  hostBox.style.transform = host === 1 ? "" : `scale(${host})`;
  // A transform takes no room, so make room for the scaled stage; else it
  // covers the button below it.
  hostBox.style.marginBottom = `${hostBox.getBoundingClientRect().height - hostBox.offsetHeight}px`;
  stage.style.setProperty("--dur", `${option("dur", "1.8")}s`);
  stage.style.setProperty("--fade", `${option("fade", "0.8")}s`);
  // Read the view's camera numbers from the SVG's own <style>, on a throwaway
  // <svg>: setting data-view on the real one would start its fade transitions.
  const probe = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  probe.setAttribute("data-view", "hairspring");
  document.body.append(probe);
  const computed = getComputedStyle(probe);
  for (const [name, variable] of [["X", "--cam-x"], ["Y", "--cam-y"], ["S", "--cam-s"], ["Z", "--cam-z"]])
    stage.style.setProperty(`--${name}`, computed.getPropertyValue(variable).trim());
  probe.remove();
  const mode = option("mode", "svg");
  const cssCamera = !onCanvas && mode === "js-css";
  const jsCamera = onCanvas || mode === "js" || cssCamera;
  const camera = onCanvas ? null
    : mode === "html" ? lens : cssCamera ? svg : svg.querySelector(".camera");
  if (!jsCamera) camera.classList.add("cam");
  if (cssCamera && option("willchange", "1") === "1") svg.style.willChange = "transform";
  if (option("ease", "linear") === "exp") stage.classList.add("exp");
  if (option("stroke", "fixed") === "fixed") stage.classList.add("fixed-stroke");
  if (option("only", "") === "hairspring") stage.classList.add("only-spring");
  const fadeLater = option("fadelater", "") === "1";
  if (fadeLater) stage.classList.add("fade-later");
  if (!onCanvas && option("clips", "on") === "off")
    svg.querySelectorAll("[clip-path]").forEach(element => element.removeAttribute("clip-path"));
  const animations = {
    spring: a => a.getAttribute("attributeName") === "d",
    balance: a => (a.getAttribute("values") ?? "").startsWith("150;"),
    fork: a => (a.getAttribute("values") ?? "").startsWith("-9;"),
    train: a => a.getAttribute("accumulate") === "sum",
    seconds: a => a.getAttribute("dur") === "60s",
  };
  if (!onCanvas) for (const name of option("drop", "").split(",").filter(Boolean))
    svg.querySelectorAll("animate, animateTransform").forEach(animation => {
      if (animations[name](animation)) animation.remove();
    });
  window.devicePixels = window.devicePixelRatio;
  let fadeTimer = null;
  if (!onCanvas && option("smil", "running") === "paused") {
    svg.pauseAnimations();
    svg.setCurrentTime(Number(option("t", "0")));
  }
  const button = document.getElementById("toggle");
  button.onclick = () => {
    zoom(!stage.classList.contains("zoomed"));
  };
  // The JS camera. X and Y grow with the scale, so one point of the canvas
  // stays still. ease=linear moves the scale linearly, ease=exp its log; both
  // eased with CSS's ease-in-out, cubic-bezier(0.42, 0, 0.58, 1).
  const [X, Y, S] = ["X", "Y", "S"].map(
    name => Number(stage.style.getPropertyValue(`--${name}`)));
  const duration = Number(option("dur", "1.8")) * 1000;
  const fade = Number(option("fade", "0.8")) * 1000;
  const logarithmic = option("ease", "linear") === "exp";
  const compensated = option("stroke", "fixed") === "compensated";
  if (compensated) stage.classList.add("compensated");
  let scale = 1, tween = null;
  function cubicBezier(x1, y1, x2, y2) {
    // solve x(t) = time for the Bezier parameter t, then return y(t)
    const bezier = (t, p1, p2) => 3 * p1 * t * (1 - t) ** 2 + 3 * p2 * t ** 2 * (1 - t) + t ** 3;
    return time => {
      let low = 0, high = 1;
      for (let step = 0; step < 30; step++) {
        const middle = (low + high) / 2;
        if (bezier(middle, x1, x2) < time) low = middle; else high = middle;
      }
      return bezier((low + high) / 2, y1, y2);
    };
  }
  const easeInOut = cubicBezier(0.42, 0, 0.58, 1); // CSS ease-in-out
  const ease = cubicBezier(0.25, 0.1, 0.25, 1); // CSS ease, the SVG's fade
  function place() {
    if (onCanvas) return; // the canvas draws the camera at each frame
    const along = (scale - 1) / (S - 1);
    if (cssCamera) // the viewBox is the <svg>'s size in px, so the numbers are the same
      camera.style.transform = `translate(${X * along}px, ${Y * along}px) scale(${scale})`;
    else camera.setAttribute("transform", `translate(${X * along} ${Y * along}) scale(${scale})`);
    if (compensated) svg.style.setProperty("--s", scale);
  }
  // The canvas: the mechanism's clock, the fade of every part but the
  // hairspring (the view's CSS keeps that part), and one draw per frame.
  const drawing = onCanvas ? readDrawing(source) : null;
  const context = onCanvas ? canvas.getContext("2d") : null;
  const faded = onCanvas ? drawing.parts.filter(part => part.name !== "hairspring") : [];
  const onlySpring = option("only", "") === "hairspring";
  const drawOptions = {
    ...DRAW_OPTIONS,
    compensate: option("stroke", "fixed") !== "scaled",
    clips: { on: "clip", off: "off", erase: "erase" }[option("clips", "on")],
  };
  const pausedAt = option("smil", "running") === "paused" ? Number(option("t", "0")) : null;
  const clockStart = performance.now();
  let restOpacity = onlySpring ? 0 : 1, fading = null;
  const drawTimes = [];
  if (onCanvas) {
    const box = canvas.getBoundingClientRect();
    canvas.width = Math.round(box.width * devicePixelRatio);
    canvas.height = Math.round(box.height * devicePixelRatio);
  }
  function render(now) {
    if (fading && !onlySpring) {
      const time = Math.min(Math.max((now - fading.start) / fade, 0), 1);
      restOpacity = fading.from + (fading.to - fading.from) * ease(time);
      if (time === 1) fading = null;
    }
    const along = (scale - 1) / (S - 1);
    const before = performance.now();
    draw(context, drawing, {
      time: pausedAt ?? (now - clockStart) / 1000,
      camera: cameraAt(X * along, Y * along, scale),
      opacity: new Map(faded.map(part => [part, restOpacity])),
      pixelsPerUnit: canvas.width / drawing.width,
    }, drawOptions);
    drawTimes.push(performance.now() - before);
  }
  function frame(now) {
    if (tween) {
      const time = Math.min(Math.max((now - tween.start) / duration, 0), 1);
      const eased = easeInOut(time);
      scale = logarithmic
        ? Math.exp(Math.log(tween.from) + (Math.log(tween.to) - Math.log(tween.from)) * eased)
        : tween.from + (tween.to - tween.from) * eased;
      place();
      if (time === 1) {
        // the canvas's fade starts when the camera stops, on zoom in
        if (onCanvas && tween.to === S) fading = { from: restOpacity, to: 0, start: now };
        tween = null;
      }
    }
    if (onCanvas) render(now);
    requestAnimationFrame(frame);
  }
  if (jsCamera) requestAnimationFrame(frame);
  function zoom(on) {
    if (jsCamera)
      tween = { from: scale, to: on ? S : 1, start: performance.now() + (on ? 0 : fade) };
    stage.classList.toggle("zoomed", on);
    button.textContent = on ? "Zoom out" : "Zoom in";
    if (onCanvas) {
      fading = on ? null : { from: restOpacity, to: 1, start: performance.now() };
      return;
    }
    clearTimeout(fadeTimer);
    if (!on) svg.removeAttribute("data-view");
    else if (fadeLater)
      fadeTimer = setTimeout(() => svg.setAttribute("data-view", "hairspring"), duration);
    else svg.setAttribute("data-view", "hairspring");
  }
  document.getElementById("status").textContent =
    [...params].map(([key, value]) => `${key}=${value}`).join(" ") || "defaults";
  function matrix() {
    if (onCanvas || cssCamera) {
      const along = (scale - 1) / (S - 1);
      return `matrix(${scale}, 0, 0, ${scale}, ${X * along}, ${Y * along})`;
    }
    if (mode !== "js") return getComputedStyle(camera).transform;
    const { a, b, c, d, e, f } = camera.transform.baseVal.consolidate()?.matrix ?? new DOMMatrix();
    return `matrix(${a}, ${b}, ${c}, ${d}, ${e}, ${f})`;
  }
  // seek(0.5): move the JS tween to its middle (the CSS modes use getAnimations)
  function seek(fraction) {
    if (tween) tween.start = performance.now() - fraction * duration;
  }
  // jump(0.5): put the camera that far along the zoom (0 to 1, linear in
  // scale) at once, with no tween (for stills)
  function jump(along) {
    tween = null;
    scale = 1 + (S - 1) * along;
    place();
  }
  // fadeTo(0.5): set every part but the hairspring to that opacity at once,
  // with no transition (for stills)
  function fadeTo(opacity) {
    if (onCanvas) {
      fading = null;
      restOpacity = opacity;
      return;
    }
    svg.querySelectorAll("[data-part]:not([data-part=hairspring])").forEach(part => {
      part.style.transition = "none";
      part.style.opacity = opacity;
    });
  }
  window.spike = { svg, canvas, zoom, camera: () => camera, matrix, seek, jump, fadeTo, drawTimes };
  const repeats = Number(option("auto", "0"));
  if (repeats) automatic(repeats);
}

// Frames for `milliseconds`: [time since start, gap before, camera scale].
function record(milliseconds) {
  return new Promise(done => {
    const frames = [];
    let last = performance.now();
    const start = last;
    function frame(now) {
      frames.push([now - start, now - last, Number(spike.matrix().slice(7).split(",")[0]) || 1]);
      last = now;
      if (now - start < milliseconds) requestAnimationFrame(frame); else done(frames);
    }
    requestAnimationFrame(frame);
  });
}

// For browsers that Playwright cannot drive (real_browsers.py): zoom in and
// out `repeats` times after the page has run for 3 s, then report.
async function automatic(repeats) {
  const status = document.getElementById("status");
  const pause = milliseconds => new Promise(done => setTimeout(done, milliseconds));
  const idle = await record(2000);
  const zooms = [];
  for (let index = 0; index < repeats; index++) {
    status.textContent = `zoom ${index + 1} of ${repeats}`;
    await pause(1000);
    spike.zoom(true);
    const zoomIn = await record(2600); // the camera (1.8 s), then the fade (0.8 s)
    await pause(500);
    spike.zoom(false);
    const zoomOut = await record(2600); // the fade, then the camera
    zooms.push({ zoomIn, zoomOut });
  }
  const report = {
    label: option("label", ""), query: location.search, userAgent: navigator.userAgent,
    window: [innerWidth, innerHeight, devicePixelRatio], idle, zooms, drawTimes: spike.drawTimes,
  };
  await fetch("report", { method: "POST", body: JSON.stringify(report) });
  status.textContent = "reported";
}
window.ready = setup();
</script>
</body>
</html>
