<path d="M58 22 L80 74 A40 12 0 0 0 160 74 L182 22" fill="none" stroke="#143C6B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
<line x1="126" y1="79" x2="150" y2="97" stroke="#143C6B" stroke-width="6" stroke-linecap="round" />
<ellipse cx="150" cy="102" rx="4.2" ry="6" fill="#143C6B" ><animate attributeName="cy" values="102;130" dur="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="1s" repeatCount="indefinite"/></ellipse>
<g clip-path="url(#w-lo)" fill="none" stroke="#143C6B" stroke-width="4" stroke-linecap="round">
  <path d="M75.0 158 A45.0 14.7 0 0 0 165.0 158" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1667;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></path>
