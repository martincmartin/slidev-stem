<svg width="240" height="190" viewBox="0 0 240 190" xmlns="http://www.w3.org/2000/svg">
<!-- W3 - Level contours
     Water as stacked level lines instead of a tinted volume: five solid 4-unit
     arcs per vessel, switching off (upper) and on (lower) one at a time across the
     8 s cycle, plus a solid 6-unit surface ellipse. Every mark is resolvable ink.
     This is the Patent set's water, translated into this palette. The cost is that
     the level now steps in five discrete jumps instead of flowing.
     Only the WATER changes. The vessel outlines, spout, drip and graduations are
     byte-identical to the shipped drawing, so this is a controlled comparison:
     see tasks/2026-09-20-animation-style/README.md S4 on shared geometry. -->
<defs>
  <clipPath id="w-up"><path d="M54 0 L186 0 L160 74 A40 12 0 0 1 80 74 Z"/></clipPath>
  <clipPath id="w-lo"><path d="M64 100 L176 100 L164 170 A44 13 0 0 1 76 170 Z"/></clipPath>
</defs>
<g clip-path="url(#w-up)" fill="none" stroke="#143C6B" stroke-width="4" stroke-linecap="round">
  <path d="M65.6 45 A54.4 15.8 0 0 0 174.4 45" opacity="1"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1667;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></path>
  <path d="M68.8 51 A51.2 14.9 0 0 0 171.2 51" opacity="1"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.3333;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></path>
  <path d="M72.0 57 A48.0 14.0 0 0 0 168.0 57" opacity="1"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.5000;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></path>
  <path d="M75.1 63 A44.9 13.0 0 0 0 164.9 63" opacity="1"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.6667;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></path>
  <path d="M78.3 69 A41.7 12.1 0 0 0 161.7 69" opacity="1"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.8333;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></path>
</g>
<ellipse cx="120" cy="40" rx="54.4" ry="15.8" fill="none" stroke="#143C6B" stroke-width="6">
  <animate attributeName="cy" values="40;70" dur="8s" repeatCount="indefinite"/><animate attributeName="rx" values="54.4;41.7" dur="8s" repeatCount="indefinite"/><animate attributeName="ry" values="15.8;12.1" dur="8s" repeatCount="indefinite"/></ellipse>
