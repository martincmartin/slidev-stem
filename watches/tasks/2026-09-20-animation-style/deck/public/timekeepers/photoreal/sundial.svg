<svg width="240" height="190" viewBox="0 0 240 190" xmlns="http://www.w3.org/2000/svg">
<!-- Photoreal set: procedural texture (feTurbulence) is the thing flat vector
     work cannot fake. Filters are kept OFF animated elements - a turbulence
     result is cached only while its input is static. -->
<defs>
  <linearGradient id="pr-s-face" x1="0.15" y1="0" x2="0.85" y2="1">
    <stop offset="0" stop-color="#D8D2C4"/><stop offset="0.4" stop-color="#B6AE9C"/>
    <stop offset="0.75" stop-color="#8C8579"/><stop offset="1" stop-color="#6B6459"/>
  </linearGradient>
  <linearGradient id="pr-s-edge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7C7568"/><stop offset="0.5" stop-color="#575147"/><stop offset="1" stop-color="#3A352E"/>
  </linearGradient>
  <linearGradient id="pr-s-bronze" x1="0" y1="0" x2="1" y2="0.35">
    <stop offset="0" stop-color="#8E7A52"/><stop offset="0.18" stop-color="#C9A45F"/>
    <stop offset="0.34" stop-color="#6E7F62"/><stop offset="0.52" stop-color="#8A6B3C"/>
    <stop offset="0.78" stop-color="#4A3B22"/><stop offset="1" stop-color="#2E2514"/>
  </linearGradient>
  <filter id="pr-s-stone" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.09 0.22" numOctaves="4" seed="11" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g" result="g2">
      <feFuncR type="linear" slope="0.3" intercept="0.72"/>
      <feFuncG type="linear" slope="0.3" intercept="0.72"/>
      <feFuncB type="linear" slope="0.3" intercept="0.72"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" in2="g2" mode="multiply"/>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="pr-s-penumbra" x="-25%" y="-60%" width="150%" height="220%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>
  <filter id="pr-s-cast" x="-30%" y="-60%" width="160%" height="240%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <radialGradient id="pr-s-ao" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0.6" stop-color="#2A2520" stop-opacity="0"/>
    <stop offset="1" stop-color="#2A2520" stop-opacity="0.45"/>
  </radialGradient>
</defs>
<ellipse cx="128" cy="164" rx="94" ry="16" fill="#2A2520" opacity="0.32" filter="url(#pr-s-cast)"/>
<path d="M24 138 A96 36 0 0 0 216 138 L216 147 A96 36 0 0 1 24 147 Z" fill="url(#pr-s-edge)"/>
