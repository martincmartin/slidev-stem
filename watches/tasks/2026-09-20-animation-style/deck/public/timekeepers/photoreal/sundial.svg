  <line x1="37.3" y1="148.3" x2="52.3" y2="146.4"/>
  </g>
  <g stroke="#2F2A23" stroke-width="3" stroke-linecap="round">
    <line x1="202.7" y1="148.3" x2="187.7" y2="146.4"/>
  <line x1="184.1" y1="158.6" x2="172.4" y2="154.8"/>
  <line x1="154.8" y1="165.6" x2="148.5" y2="160.5"/>
