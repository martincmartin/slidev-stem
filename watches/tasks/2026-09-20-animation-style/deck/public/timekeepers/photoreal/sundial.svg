<ellipse cx="120" cy="138" rx="96" ry="36" fill="url(#pr-s-ao)"/>
<g opacity="0.55">
  <ellipse cx="120" cy="138.8" rx="83" ry="30" fill="none" stroke="#EFE9DC" stroke-width="1.6"/>
