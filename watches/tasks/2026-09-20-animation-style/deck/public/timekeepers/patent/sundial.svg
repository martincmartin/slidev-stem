<!-- Patent set. The goal is the CLARITY of a technical drawing: the line-weight
     hierarchy, the section hatch, the stipple that a patent plate or an engineering
     elevation uses to separate structure from detail. The goal is NOT to be
     recognisable AS a patent drawing. Reference numerals, their leader lines and
     the dot terminators are deliberately absent, and removing them was an explicit
     choice by the user (2026-09-21). DO NOT ADD THEM BACK without the user's
     explicit direction.
