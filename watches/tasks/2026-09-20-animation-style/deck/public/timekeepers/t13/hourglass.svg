<svg width="240" height="190" viewBox="0 0 240 190" xmlns="http://www.w3.org/2000/svg">
<!-- Line's bulbs sit at x=88/152 rather than the 86/154 the other sets use, so
     the clips are drawn one unit tighter to stay inside the 3-wide outline. -->
<defs>
  <clipPath id="t13-h-up"><path d="M90 20 L150 20 C150 62 124 80 121 94 L119 94 C116 80 90 62 90 20 Z"/></clipPath>
  <clipPath id="t13-h-lo"><path d="M119 96 C116 110 90 128 90 170 L150 170 C150 128 124 110 121 96 Z"/></clipPath>
</defs>
<line x1="70" y1="18" x2="70" y2="172" stroke="#928E88" stroke-width="4"/>
<line x1="170" y1="18" x2="170" y2="172" stroke="#928E88" stroke-width="4"/>
<rect x="62" y="8" width="116" height="10" rx="3" fill="#928E88"/>
<rect x="62" y="172" width="116" height="10" rx="3" fill="#928E88"/>
<g clip-path="url(#t13-h-up)">
  <rect x="88" y="20" width="64" height="76" fill="#1F5FA8" fill-opacity="0.85">
    <animate attributeName="y" values="20;94" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="height" values="76;0" dur="9s" repeatCount="indefinite"/>
  </rect>
</g>
<line x1="120" y1="96" x2="120" y2="172" stroke="#1F5FA8" stroke-width="2.5" stroke-dasharray="6 6">
  <animate attributeName="stroke-dashoffset" values="24;0" dur="0.6s" repeatCount="indefinite"/>
</line>
<g clip-path="url(#t13-h-lo)">
  <path d="M90 172 L150 172 L150 170 C139 169 130 168 120 168 C110 168 101 169 90 170 Z" fill="#1F5FA8" fill-opacity="0.85">
    <animate attributeName="d" values="M90 172 L150 172 L150 170 C139 169 130 168 120 168 C110 168 101 169 90 170 Z;M90 172 L150 172 L150 158 C139 156 130 146 120 146 C110 146 101 156 90 158 Z;M90 172 L150 172 L150 148 C139 145 130 130 120 130 C110 130 101 145 90 148 Z" dur="9s" repeatCount="indefinite"/>
  </path>
</g>
<path d="M88 18 C88 62 114 80 116 95 C114 110 88 128 88 172" stroke="#1F5FA8" stroke-width="3" fill="none"/>
<path d="M152 18 C152 62 126 80 124 95 C126 110 152 128 152 172" stroke="#1F5FA8" stroke-width="3" fill="none"/>
</svg>
