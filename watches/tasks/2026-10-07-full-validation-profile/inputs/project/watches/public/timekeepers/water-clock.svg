<svg width="122" height="97" viewBox="0 0 240 190" xmlns="http://www.w3.org/2000/svg">
<!-- Water clock. The water is drawn at fill-opacity 0.60 (body) and 0.78 (surface
     disc). The level change is the whole animation, so these values are set by
     two limits (stem/docs/illustrations.md, "Washes"):
       >= 0.55  or the water falls below 3:1 on the panel, and the back row
                cannot see the level move;
       <= 0.85  or the water merges with the vessel outline, which is the same hue.
     The values sit low in that window on purpose: darker water reads as ink, not
     as a liquid. Do not raise it toward solid. The measured alternatives are in
     watches/tasks/2026-09-20-animation-style/water-clock-fix/. -->
<defs>
  <clipPath id="water-clock-upper-clip"><path d="M54 0 L186 0 L160 74 A40 12 0 0 1 80 74 Z"/></clipPath>
  <clipPath id="water-clock-lower-clip"><path d="M64 100 L176 100 L164 170 A44 13 0 0 1 76 170 Z"/></clipPath>
</defs>
<g clip-path="url(#water-clock-upper-clip)"><rect x="54" y="40" width="132" height="52" fill="#143C6B" fill-opacity="0.60">
  <animate attributeName="y" values="40;70" dur="8s" repeatCount="indefinite"/><animate attributeName="height" values="52;22" dur="8s" repeatCount="indefinite"/></rect></g>
<ellipse cx="120" cy="40" rx="54.4" ry="15.8" fill="#143C6B" fill-opacity="0.78">
  <animate attributeName="cy" values="40;70" dur="8s" repeatCount="indefinite"/><animate attributeName="rx" values="54.4;41.7" dur="8s" repeatCount="indefinite"/><animate attributeName="ry" values="15.8;12.1" dur="8s" repeatCount="indefinite"/></ellipse>
<ellipse cx="120" cy="22" rx="62" ry="18" fill="none" stroke="#143C6B" stroke-width="6" />
<path d="M58 22 L80 74 A40 12 0 0 0 160 74 L182 22" fill="none" stroke="#143C6B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
<line x1="126" y1="79" x2="150" y2="97" stroke="#143C6B" stroke-width="6" stroke-linecap="round" />
<ellipse cx="150" cy="102" rx="4.2" ry="6" fill="#143C6B" ><animate attributeName="cy" values="102;130" dur="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="1s" repeatCount="indefinite"/></ellipse>
<g clip-path="url(#water-clock-lower-clip)"><rect x="64" y="164" width="112" height="22" fill="#143C6B" fill-opacity="0.60">
  <animate attributeName="y" values="164;128" dur="8s" repeatCount="indefinite"/><animate attributeName="height" values="22;58" dur="8s" repeatCount="indefinite"/></rect></g>
<ellipse cx="120" cy="164" rx="45.0" ry="14.7" fill="#143C6B" fill-opacity="0.78">
  <animate attributeName="cy" values="164;128" dur="8s" repeatCount="indefinite"/><animate attributeName="rx" values="45.0;50.7" dur="8s" repeatCount="indefinite"/><animate attributeName="ry" values="14.7;16.6" dur="8s" repeatCount="indefinite"/></ellipse>
<ellipse cx="120" cy="120" rx="52" ry="17" fill="none" stroke="#143C6B" stroke-width="6" />
<path d="M68 120 L76 170 A44 13 0 0 0 164 170 L172 120" fill="none" stroke="#143C6B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
<g fill="none" stroke="#2A2520" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"><path d="M109 151.6 A49.5 16.2 0 0 0 131 151.6"/><path d="M109 163.6 A47.4 15.5 0 0 0 131 163.6"/></g>
</svg>
