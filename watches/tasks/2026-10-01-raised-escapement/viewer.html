  <body>
    <header>
      <h1>Watch geometry viewer</h1>
      <div class="controls">
        <label
          >Model
          <select id="model">
            <option value="1">B · Raised escape wheel</option>
            <option value="0">A · Lower oscillator</option>
            <option value="2">C · Stepped fork</option>
            <option value="3">Current model</option>
          </select></label
        >
        <label
          >Tilt
          <input
            id="tilt"
            type="range"
            min="-180"
            max="180"
            step="1"
            value="75"
          /><output id="angle">75°</output></label
        >
        <button id="top" type="button">Top · 0°</button
        ><button id="almost" type="button">75°</button
        ><button id="side" type="button">Side · 90°</button>
        <label
          >Zoom
          <input
            id="zoom"
            type="range"
            min="0.25"
            max="16"
            step="0.05"
            value="4.3"
        /></label>
        <button id="reset" type="button">Reset view</button>
        <label><input id="full" type="checkbox" />Whole watch</label>
        <label
          ><input id="highlight" type="checkbox" checked />Highlight
          escapement</label
        >
        <button id="play" type="button" aria-pressed="false">Play</button
        ><button id="tick" type="button">Tick</button
        ><button id="tock" type="button">Tock</button>
      </div>
    </header>
    <main id="viewport">
      <canvas
        id="stage"
        tabindex="0"
        aria-label="Interactive watch. Drag or use WASD to pan. Scroll to zoom. Use the tilt slider to rotate around the x axis."
      ></canvas>
    </main>
    <footer>
      <p id="description"></p>
      <div>
        Scroll to zoom · Drag or hold WASD to pan · Tilt rotates around the x
        axis · R resets the view
      </div>
      <div id="status">
        Blue: balance and hairspring. Brown: roller, jewel and fork.
      </div>
      <div id="error" role="alert"></div>
    </footer>
  </body>
</html>
