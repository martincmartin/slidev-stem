<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watch geometry viewer</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #2a2520;
        background: #faf7f0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 16px 22px 12px;
        border-bottom: 1px solid #736a60;
      }
      h1 {
        font-size: 23px;
        margin: 0 0 12px;
      }
      .controls {
        display: flex;
        gap: 12px 20px;
        align-items: center;
        flex-wrap: wrap;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
      }
      button,
      select {
        font: inherit;
        padding: 7px 10px;
        color: inherit;
        background: #faf7f0;
        border: 1px solid #736a60;
        border-radius: 5px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: #d3dce3;
      }
      input[type="range"] {
        width: 170px;
        accent-color: #143c6b;
      }
      output {
        min-width: 44px;
      }
      #viewport {
        position: relative;
        flex: 1;
        min-height: 200px;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
        outline-offset: -3px;
      }
      canvas:active {
        cursor: grabbing;
      }
      footer {
        padding: 10px 22px;
        font-size: 15px;
        border-top: 1px solid #736a60;
        line-height: 1.5;
      }
      #description {
        margin: 0;
      }
      #status {
        color: #143c6b;
      }
      #error {
        color: #9a6238;
        font-weight: 600;
      }
      @media (max-width: 600px) {
        header {
          padding: 10px;
        }
        h1 {
          font-size: 20px;
        }
        .controls {
          gap: 8px;
        }
        footer {
          padding: 8px 10px;
        }
        input[type="range"] {
          width: 120px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Watch geometry viewer</h1>
      <div class="controls">
        <label
          >Model
          <select id="model">
            <option value="1">B · Raised escape wheel</option>
            <option value="0">A · Lower oscillator</option>
            <option value="2">C · Stepped fork</option>
            <option value="3">Current model</option>
          </select></label
        >
        <label
          >Tilt
          <input
            id="tilt"
            type="range"
            min="-180"
            max="180"
            step="1"
            value="75"
          /><output id="angle">75°</output></label
        >
        <button id="top" type="button">Top · 0°</button
        ><button id="almost" type="button">75°</button
        ><button id="side" type="button">Side · 90°</button>
        <label
          >Zoom
          <input
            id="zoom"
            type="range"
            min="0.25"
            max="16"
            step="0.05"
            value="4.3"
        /></label>
        <button id="reset" type="button">Reset view</button>
        <label><input id="full" type="checkbox" />Whole watch</label>
        <label
          ><input id="highlight" type="checkbox" checked />Highlight
          escapement</label
        >
        <button id="play" type="button" aria-pressed="false">Play</button
        ><button id="tick" type="button">Tick</button
        ><button id="tock" type="button">Tock</button>
      </div>
    </header>
    <main id="viewport">
      <canvas
        id="stage"
        tabindex="0"
        aria-label="Interactive watch. Drag or use WASD to pan. Scroll to zoom. Use the tilt slider to rotate around the x axis."
      ></canvas>
    </main>
    <footer>
      <p id="description"></p>
      <div>
        Scroll to zoom · Drag or hold WASD to pan · Tilt rotates around the x
        axis · R resets the view
      </div>
      <div id="status">
        Blue: balance and hairspring. Brown: roller, jewel and fork.
      </div>
      <div id="error" role="alert"></div>
    </footer>
    <script type="module" src="./viewer.ts"></script>
  </body>
</html>
