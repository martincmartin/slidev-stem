<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WebGL watch spike</title>
    <style>
      body { margin: 0; background: #faf7f0; font: 14px system-ui, sans-serif; color: #2a2520; }
      canvas { display: block; width: 980px; height: 552px; }
      form { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 10px; max-width: 960px; }
      label { display: flex; gap: 6px; align-items: center; }
      output { min-width: 4ch; font-variant-numeric: tabular-nums; }
      body.probe form { display: none; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <form id="controls">
      <label>View <select name="view"><option>cover</option><option>hairspring</option><option>crown</option></select></label>
      <label>Tilt <input name="tilt" type="range" min="0" max="89.9" step="0.1" value="45" /><output name="tiltOut"></output>°</label>
      <label>Time <input name="time" type="range" min="0" max="4" step="0.01" value="0.37" /><output name="timeOut"></output> s</label>
      <label><input name="play" type="checkbox" /> Run the mechanism</label>
      <label><input name="sweep" type="checkbox" /> Sweep the tilt</label>
      <label><input name="clips" type="checkbox" /> 2D clip paths</label>
      <label>Hidden lines
        <select name="method">
          <option value="3">centre line, 2 × 2 texels (proposed)</option>
          <option value="2">centre line, 3 × 3 texels</option>
          <option value="0">constant bias (Bartosz)</option>
          <option value="1">slope-scaled offset</option>
        </select>
      </label>
      <label>Bias <input name="bias" type="number" value="1" step="0.25" min="0" style="width: 5em" /> px</label>
      <label>Lines
        <select name="lineWidth">
          <option value="">house (2–4 px)</option>
          <option value="1">1 px (Bartosz)</option>
          <option value="6">6 px</option>
        </select>
      </label>
      <label>FPS <output name="fps"></output></label>
    </form>
    <script type="module">
      import { Renderer, Method } from "./renderer.js";

      const scene = await (await fetch("../../../out/scene.json")).json();
      const canvas = document.getElementById("stage");
      const renderer = new Renderer(canvas, scene);
      const form = document.getElementById("controls");

      function settings() {
        const data = new FormData(form);
        const width = data.get("lineWidth");
        return {
          view: data.get("view"),
          tilt: Number(data.get("tilt")),
          time: Number(data.get("time")),
          method: Number(data.get("method")),
          bias: Number(data.get("bias")),
          lineWidth: width === "" ? null : Number(width),
          clips: form.clips.checked,
        };
      }

      // The probe's interface: draw one still, or time a run of frames.
      window.spike = {
        Method,
        info: () => renderer.info(),
        render(options) {
          renderer.render(options);
          renderer.gl.finish();
          const error = renderer.gl.getError();
          if (error !== renderer.gl.NO_ERROR) throw new Error(`WebGL error ${error}`);
        },
        // Tilt from 0 to 89 degrees and back while the mechanism runs; report
        // the JS time per frame, the time with gl.finish(), and the frame gaps.
        async timeFrames({ seconds, view, method, finish }) {
          const intervals = [];
          const drawTimes = [];
          let previous = null;
          const started = performance.now();
          await new Promise((resolve) => {
            function frame(now) {
              if (previous !== null) intervals.push(now - previous);
              previous = now;
              const elapsed = (now - started) / 1000;
              const tilt = 44.5 - 44.5 * Math.cos(elapsed * 1.2);
              const before = performance.now();
              renderer.render({ view, tilt, time: elapsed, method });
              if (finish) renderer.gl.finish();
              drawTimes.push(performance.now() - before);
              if (elapsed < seconds) requestAnimationFrame(frame);
              else resolve();
            }
            requestAnimationFrame(frame);
          });
          return { intervals, drawTimes };
        },
      };
      if (new URLSearchParams(location.search).has("probe")) {
        document.body.classList.add("probe");
      } else {
        let last = performance.now();
        let frames = 0;
        function loop(now) {
          const state = settings();
          if (form.play.checked) form.time.value = ((Number(form.time.value) + 1 / 60) % 4).toFixed(3);
          if (form.sweep.checked) form.tilt.value = (44.95 - 44.95 * Math.cos(now / 1000)).toFixed(1);
          form.tiltOut.value = Number(form.tilt.value).toFixed(1);
          form.timeOut.value = Number(form.time.value).toFixed(2);
          renderer.render(state);
          frames++;
          if (now - last > 500) {
            form.fps.value = Math.round((frames * 1000) / (now - last));
            frames = 0;
            last = now;
          }
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      }
      window.spikeReady = true;
    </script>
  </body>
</html>
