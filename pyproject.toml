# The house's Python: stem/tools/ and the scripts in stem/tasks/. It is not a
# package. Each talk is a separate uv project, with its own pyproject.toml,
# uv.lock and .venv; see "Given talks and versions" in AGENTS.md.
#
#   uv run tools/artcheck.py <path>        # run a tool; uv makes stem/.venv first
#
# The tools that render install Chromium the first time they run
# (tools/browsers.py).

[project]
name = "stem-tools"
version = "0"
requires-python = "==3.15.*"
dependencies = [
  "numpy>=2.5.4",
  "pillow>=13.0.0",
  "playwright>=1.64.1",
]

[dependency-groups]
# The style and type checkers that tools/check_python.py runs, and codespell,
# which tools/spellcheck.ts runs.
dev = [
  "codespell>=2.4.3",
  "mypy>=2.4.0",
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "ruff>=0.17.2",
]

[tool.uv]
package = false
# Only an interpreter that uv installed: a Homebrew upgrade must not remove the
# interpreter of a venv.
python-preference = "only-managed"

[tool.ruff]
target-version = "py315"
# A bare `ruff format` must not change a task: a finished task is frozen. (ruff
# uses the nearest config for each file, so `include` cannot keep it out: a
# task keeps its own copies of pyproject.toml.) tools/validate.py gives ruff
# the paths in [tool.mypy] files.
extend-exclude = ["tasks"]
# Python only. Markdown is Prettier's (ruff would format its Python blocks).
include = ["*.py", "*.pyi"]
# The publish workflow runs this with the GitHub runner's python3, not uv's.
per-file-target-version = { "tools/publish_plan.py" = "py312" }

[tool.ruff.lint]
# Beyond ruff's defaults: import order, newer syntax, likely bugs, simpler code,
# comprehensions, pathlib, naming, performance, ruff's own, and a `noqa` or
# `type: ignore` that names its codes (PGH; RUF100 finds an unused `noqa`).
# Not PL (the tools' constants are deliberate), S (the subprocess calls) or D
# (the house's docstring style). See tasks/2026-09-28-validate/PLAN.md.
extend-select = ["I", "UP", "B", "SIM", "C4", "PTH", "N", "PERF", "PGH", "RUF"]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["tools"]

[tool.pyright]
pythonVersion = "3.15"
include = ["tools"]
venvPath = "."
venv = ".venv"
