<!doctype html><html><body style="margin:0;background:#fff">
<!-- 0: <img>, opacity from the file's own :root block (0.5) -->
<img style="position:absolute;left:0;top:0" src="opacity-var.svg">
<!-- 1: inline, opacity from the page's variable (0.5) -->
<svg style="position:absolute;left:110px;top:0;--art-substance:0.5" width="100" height="100">
<rect x="0" y="0" width="100" height="50" fill="#143C6B" fill-opacity="var(--art-substance)"/>
<line x1="0" y1="75" x2="100" y2="75" stroke="#143C6B" stroke-width="30" stroke-opacity="var(--art-substance)"/>
</svg>
</body></html>
